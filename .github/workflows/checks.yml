name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated shell regressions
        run: bash tests/run.sh
      - name: PHP syntax
        run: find snippets -name '*.php' -print0 | xargs -0 -n 1 php -l
